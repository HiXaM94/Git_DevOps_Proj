<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Mini projet – Compteur</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <h1>Mini projet Git / DevOps</h1>
      <p class="subtitle">
        Petit compteur JavaScript pour tester le workflow Git.
      </p>

      <section class="card">
        <h2>Compteur</h2>
        <div class="counter-display" id="counter-value">0</div>
        <div class="actions">
          <button id="btn-decrement">-1</button>
          <button id="btn-reset">Reset</button>
          <button id="btn-increment">+1</button>
        </div>
      </section>

      <footer class="footer">
        <p>
          Modifie ce projet sur une branche <code>feature/...</code>, fais un
          commit puis une Pull Request sur GitHub.
        </p>
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>

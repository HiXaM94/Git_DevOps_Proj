<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster Pro - TP4</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <div class="container">
        <header>
            <h1>TaskMaster <span class="badge">Pro</span></h1>
            <p id="date-display"></p>
        </header>

        <div class="input-group">
            <input type="text" id="task-input" placeholder="Ajouter une nouvelle tâche...">
            <button id="add-btn"><i class="fas fa-plus"></i></button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Toutes</button>
            <button class="filter-btn" data-filter="completed">Terminées</button>
            <button class="filter-btn" data-filter="active">À faire</button>
        </div>

        <div class="tasks-container">
            <ul id="task-list">
                <!-- Les tâches seront ajoutées ici dynamiquement -->
            </ul>
        </div>

        <div class="stats">
            <span><strong id="task-count">0</strong> tâches restantes</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
